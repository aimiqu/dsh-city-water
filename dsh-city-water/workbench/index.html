<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>城市水智管 · 水资源管理 Agent</title>
  <link rel="stylesheet" href="/api/dsh-city-water/workbench/water.css">
  <!--CW_DATA-->
</head>
<body>
  <main class="app-shell" id="app">
    <aside class="sidebar">
      <button class="brand" data-action="nav-overview" aria-label="返回综合研判">
        <span class="brand-mark"><i>≈</i></span><span class="brand-name">城市水智管</span>
      </button>
      <nav aria-label="主导航" id="main-nav"></nav>
      <div class="sidebar-foot"><span>▦</span><div><b>青岛市水务局</b><small>管理端 · V2.6</small></div></div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><strong>水资源管理</strong><span>/</span><b id="crumb">综合研判</b></div>
        <button class="host-pill" id="host-status" title="DSH 宿主插件连接状态"><i></i><span>连接中…</span></button>
        <div class="top-actions">
          <button class="city-switch" data-action="cycle-city" title="切换城市（演示数据）"><span>▦</span><b id="city-name">青岛市</b><b>⌄</b></button>
          <span class="date"><i>▣</i><span id="date-label"></span></span>
          <button class="search-trigger" data-action="open-command"><span>⌕</span><span class="search-label">搜索数据、功能或指令…</span><kbd>⌘ K</kbd></button>
          <button class="back-to-chat" data-action="back-to-chat" title="收起工作台面板，返回 DSH 主会话">收起面板 ⌄</button>
          <button class="notice-btn" data-action="toggle-notifications" aria-label="通知"><span>♢</span><i id="notice-count">3</i></button>
          <button class="avatar" data-action="avatar">管</button>
        </div>
      </header>

      <div class="page-area" id="page-area"></div>

      <aside class="utility-rail" aria-label="系统工具">
        <button data-action="toggle-drawer" data-drawer="data"><span>◉</span>数据源</button>
        <button data-action="toggle-drawer" data-drawer="model"><span>◆</span>模型</button>
        <button data-action="toggle-drawer" data-drawer="plugin"><span>▦</span>插件</button>
        <button data-action="toggle-drawer" data-drawer="log"><span>▤</span>日志</button>
      </aside>

      <div id="overlay-root"></div>
    </section>
  </main>
  <script src="/api/dsh-city-water/workbench/water.js"></script>
</body>
</html>
